<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aetheria | Redirecting</title>
    <meta name="theme-color" content="#07101a" />
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        var redirect = window.location.pathname + window.location.search + window.location.hash;
        window.location.replace('/?redirect=' + encodeURIComponent(redirect));
      })();
    </script>
  </head>
  <body></body>
</html>
